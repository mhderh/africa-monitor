# Dashboard look: a dark "intelligence platform" theme. The chart colours in
# dashboard/app.py were chosen for this dark background.
[theme]
base = "dark"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111a2b"
textColor = "#e6edf3"
primaryColor = "#3987e5"
font = "sans serif"

[client]
toolbarMode = "minimal"
