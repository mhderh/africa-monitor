# ---------------------------------------------------------------------------
# PLACES - African countries and hotspot cities we can recognise in articles
# ---------------------------------------------------------------------------
# Countries:
#   region   which region it belongs to in the digest and dashboard
#   lat/lon  approximate centre of the country (used on the map when no
#            city is named)
#   aliases  how articles write it (English, French, Arabic, adjectives).
#            Same matching rules as keywords.yaml: a star at the end matches
#            longer words ("Nigeria*" matches Nigerian, Nigerians).
#
# Cities / provinces: name, country (must match a country name below),
# lat/lon, aliases.
#
# Longer names are checked first, so "South Sudan" is never read as "Sudan"
# and "Niger Delta" is never read as "Niger".
# Coordinates are approximate - fine for a map, not for navigation.
# ---------------------------------------------------------------------------

